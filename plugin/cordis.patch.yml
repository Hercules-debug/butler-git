# dsh-butler-git —— bundle patch
#
# 把 git 原生的节点门禁工具挂进 profile 的组合层。
#
# 语法要点(和 dsh-butler 一致):
#  - `insert:` 用于**新增**条目;不带 insert 的顶层条目是**修改已存在**的条目
#  - `name` 必须是 Node 可解析的包名,与 package.json 的 name 一致
#
# 本插件只注册四个模型工具(node_check / node_declare / node_accept / node_tree),
# 不改动 DSH 既有条目。
#
# 卸载:从 profile 的 dsh.profile.bundles 移除 dsh-butler-git 即可。

- insert:
    - id: butler-git-tools
      name: dsh-butler-git
